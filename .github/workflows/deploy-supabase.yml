# Mise en ligne automatique de la base (migrations) et des fonctions serveur Supabase.
#
# Se déclenche quand une modification de supabase/migrations ou supabase/functions arrive sur la
# branche de production, APRÈS la réussite des tests de sécurité (RLS). Plus besoin de taper
# « supabase db push --remote » ni « supabase functions deploy ».
#
# Secrets à créer une seule fois (GitHub → Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN  — jeton personnel Supabase (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   — mot de passe de la base (Supabase → Project Settings → Database)
name: Mise en ligne Supabase

on:
  push:
    branches: ['claude/spec-md-instructions-14v2w9']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'
  # Bouton « Run workflow » dans l'onglet Actions, pour relancer à la main.
  workflow_dispatch:

# Jamais deux mises en ligne en même temps (l'une attend la fin de l'autre).
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: lzjcowifdikadgaiurfk

jobs:
  rls:
    name: Tests de sécurité (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-rls.sh

  deploy:
    name: Migrations et fonctions
    needs: rls
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Vérifier les secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secrets manquants : ajoute SUPABASE_ACCESS_TOKEN et SUPABASE_DB_PASSWORD (README, section 5)."
            exit 1
          fi

      - name: Vérifier la copie du module core dans les fonctions
        run: node scripts/sync-core.mjs --check

      - name: Relier le projet Supabase
        run: npx supabase link --project-ref "$PROJECT_REF" --yes

      - name: Migrations à appliquer (aperçu)
        run: npx supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer les migrations
        run: npx supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Déployer les fonctions serveur
        run: npx supabase functions deploy --use-api --yes
