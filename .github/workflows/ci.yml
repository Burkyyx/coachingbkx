# Intégration continue : vérifie automatiquement chaque modification poussée sur GitHub.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: Typecheck, lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run core:check
      - run: npm run test:coverage -- --ci

  rls:
    name: Tests de sécurité (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-rls.sh
